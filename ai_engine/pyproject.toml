[project]
name = "ai-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "tenacity>=9.1.4",
]

# Optional ML stack used only by src/ml/forecasting.py.
[project.optional-dependencies]
ml = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires a live LLM provider (set RUN_LLM_TESTS=1)",
]

[tool.pyright]
extraPaths = ["."]
